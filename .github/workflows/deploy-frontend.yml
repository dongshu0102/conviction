name: Deploy Frontend to AWS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC — no long-lived AWS keys stored in GitHub
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fininsight-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://p8xpcshdn9.us-east-1.awsapprunner.com \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # Using update-service (not start-deployment alone) so the runtime
      # environment variable fix below is re-asserted on every deploy,
      # not just inherited from whatever the service happened to be
      # configured with previously. This is the single most important
      # step in this file — without HOSTNAME/HOST explicitly set here,
      # App Runner's runtime silently overrides the image's own
      # Dockerfile ENV, and the TCP health check fails with no
      # obviously-related error message. This took a full debugging
      # session (including an AWS Support case) to diagnose — see
      # case-512768499510-muen-2026-ec27abb990950b1a for the full
      # investigation. Do not remove these two variables.
      - name: Update App Runner service
        run: |
          aws apprunner update-service \
            --service-arn "${{ secrets.FRONTEND_APP_RUNNER_SERVICE_ARN }}" \
            --source-configuration '{
              "AuthenticationConfiguration": {
                "AccessRoleArn": "arn:aws:iam::512768499510:role/AppRunnerECRAccessRole"
              },
              "ImageRepository": {
                "ImageIdentifier": "512768499510.dkr.ecr.us-east-1.amazonaws.com/fininsight-web:latest",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "8000",
                  "RuntimeEnvironmentVariables": {
                    "HOSTNAME": "0.0.0.0",
                    "HOST": "0.0.0.0"
                  }
                }
              },
              "AutoDeploymentsEnabled": false
            }'

      # CRITICAL — do not remove. update-service diffs the SOURCE
      # CONFIGURATION TEXT, not the image digest behind the ":latest"
      # tag. Since that JSON is byte-identical on every deploy (same
      # tag, same env vars), App Runner sees "no config change" and
      # silently skips pulling the new image — update-service can
      # return success while the running container never changes.
      # Confirmed in production: months of deploys produced zero
      # UPDATE_SERVICE/DEPLOYMENT operations in `apprunner
      # list-operations`, only the original CREATE_SERVICE — meaning
      # every prior "successful" deploy was a no-op. Wait first so we
      # don't race a deployment update-service itself might have
      # triggered, then force an unconditional redeploy, then wait for
      # it to finish so the job doesn't report green before the new
      # image is actually live.
      #
      # NOTE: `aws apprunner wait ...` does not exist — App Runner has
      # no waiters defined in the AWS CLI at all (confirmed: only
      # certain services like EC2 ship waiters.json; App Runner isn't
      # one of them). This was assumed rather than verified when this
      # workflow was first written and broke CI as a result — polling
      # describe-service directly is the correct approach here, not a
      # workaround.
      - name: Wait for service to settle
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ secrets.FRONTEND_APP_RUNNER_SERVICE_ARN }}" \
              --query 'Service.Status' --output text)
            echo "Service status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for service to reach RUNNING before starting deployment"
          exit 1

      - name: Force deployment of the newly pushed image
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ secrets.FRONTEND_APP_RUNNER_SERVICE_ARN }}"

      - name: Wait for deployment to complete
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ secrets.FRONTEND_APP_RUNNER_SERVICE_ARN }}" \
              --query 'Service.Status' --output text)
            echo "Service status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment to complete"
          exit 1
