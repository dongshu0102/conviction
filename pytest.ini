[pytest]
# Explicit, unconditional fix — not relying on __init__.py-walking
# import-mode heuristics, which is what silently failed here despite
# tests/__init__.py and tests/unit/__init__.py both existing correctly.
pythonpath = .

# Scope default collection to this project's own tests only.
# mcp_server/ is a SEPARATE project with its own dependencies and its
# own venv (see mcp_server/pytest.ini) — without this, a bare `pytest`
# from the repo root sweeps up mcp_server/tests/ too, which then fails
# to even import (no `mcp` package in this venv, by design).
testpaths = tests
